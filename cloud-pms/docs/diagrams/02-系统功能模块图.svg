<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 680" width="980" height="680">
  <title>系统功能模块图</title>
  <desc>云协同 PMS 共七大功能模块：系统管理、项目管理、任务管理、工时管理、文件管理、消息中心、统计报表，并列出各自的子功能。</desc>

  <defs>
    <style>
      .root  { font-family:"Microsoft YaHei",sans-serif; font-size:16px; font-weight:bold; fill:#ffffff; }
      .mod   { font-family:"Microsoft YaHei",sans-serif; font-size:13px; font-weight:bold; fill:#ffffff; }
      .sub   { font-family:"Microsoft YaHei",sans-serif; font-size:11px; fill:#33475b; }
    </style>
  </defs>

  <rect x="0" y="0" width="980" height="680" fill="#ffffff"/>

  <text x="490" y="30" text-anchor="middle"
        style="font-family:'Microsoft YaHei',sans-serif;font-size:18px;font-weight:bold;fill:#1f2d3d;">
    云协同 PMS 系统功能模块图
  </text>

  <!-- 根节点 -->
  <rect x="370" y="50" width="240" height="46" rx="8" fill="#2b5c8a"/>
  <text x="490" y="79" text-anchor="middle" class="root">云协同 PMS 系统</text>

  <!-- 主干竖线 -->
  <line x1="490" y1="96" x2="490" y2="122" stroke="#8c9bab" stroke-width="1.8"/>

  <!-- 横向分配线 -->
  <line x1="70" y1="122" x2="910" y2="122" stroke="#8c9bab" stroke-width="1.8"/>

  <!-- ========== 模块 1：系统管理 ========== -->
  <line x1="70" y1="122" x2="70" y2="150" stroke="#8c9bab" stroke-width="1.8"/>
  <rect x="30" y="150" width="80" height="36" rx="6" fill="#3f6ea8"/>
  <text x="70" y="173" text-anchor="middle" class="mod">系统管理</text>
  <rect x="10" y="196" width="120" height="176" rx="6" fill="#edf3fa" stroke="#aac4de"/>
  <text x="70" y="216" text-anchor="middle" class="sub">用户管理</text>
  <text x="70" y="238" text-anchor="middle" class="sub">角色管理</text>
  <text x="70" y="260" text-anchor="middle" class="sub">菜单管理</text>
  <text x="70" y="282" text-anchor="middle" class="sub">部门管理</text>
  <text x="70" y="304" text-anchor="middle" class="sub">岗位管理</text>
  <text x="70" y="326" text-anchor="middle" class="sub">字典管理</text>
  <text x="70" y="348" text-anchor="middle" class="sub">参数配置</text>

  <!-- ========== 模块 2：项目管理 ========== -->
  <line x1="210" y1="122" x2="210" y2="150" stroke="#8c9bab" stroke-width="1.8"/>
  <rect x="170" y="150" width="80" height="36" rx="6" fill="#2f7d5b"/>
  <text x="210" y="173" text-anchor="middle" class="mod">项目管理</text>
  <rect x="150" y="196" width="120" height="110" rx="6" fill="#e9f5ef" stroke="#9ccdb8"/>
  <text x="210" y="216" text-anchor="middle" class="sub">项目立项</text>
  <text x="210" y="238" text-anchor="middle" class="sub">项目成员</text>
  <text x="210" y="260" text-anchor="middle" class="sub">里程碑</text>
  <text x="210" y="282" text-anchor="middle" class="sub">项目状态流转</text>

  <!-- ========== 模块 3：任务管理 ========== -->
  <line x1="350" y1="122" x2="350" y2="150" stroke="#8c9bab" stroke-width="1.8"/>
  <rect x="310" y="150" width="80" height="36" rx="6" fill="#8a6d3b"/>
  <text x="350" y="173" text-anchor="middle" class="mod">任务管理</text>
  <rect x="290" y="196" width="120" height="154" rx="6" fill="#faf5e9" stroke="#d9c3a3"/>
  <text x="350" y="216" text-anchor="middle" class="sub">任务拆解</text>
  <text x="350" y="238" text-anchor="middle" class="sub">任务指派</text>
  <text x="350" y="260" text-anchor="middle" class="sub">看板视图</text>
  <text x="350" y="282" text-anchor="middle" class="sub">甘特图</text>
  <text x="350" y="304" text-anchor="middle" class="sub">任务评论</text>
  <text x="350" y="326" text-anchor="middle" class="sub">逾期预警</text>

  <!-- ========== 模块 4：工时管理 ========== -->
  <line x1="490" y1="122" x2="490" y2="150" stroke="#8c9bab" stroke-width="1.8"/>
  <rect x="450" y="150" width="80" height="36" rx="6" fill="#7b5e9c"/>
  <text x="490" y="173" text-anchor="middle" class="mod">工时管理</text>
  <rect x="430" y="196" width="120" height="110" rx="6" fill="#f2edf8" stroke="#b8a5d0"/>
  <text x="490" y="216" text-anchor="middle" class="sub">工时填报</text>
  <text x="490" y="238" text-anchor="middle" class="sub">工时审批</text>
  <text x="490" y="260" text-anchor="middle" class="sub">我的工时</text>
  <text x="490" y="282" text-anchor="middle" class="sub">工时统计</text>

  <!-- ========== 模块 5：文件管理 ========== -->
  <line x1="630" y1="122" x2="630" y2="150" stroke="#8c9bab" stroke-width="1.8"/>
  <rect x="590" y="150" width="80" height="36" rx="6" fill="#a05a3f"/>
  <text x="630" y="173" text-anchor="middle" class="mod">文件管理</text>
  <rect x="570" y="196" width="120" height="110" rx="6" fill="#fbefea" stroke="#d9b3a3"/>
  <text x="630" y="216" text-anchor="middle" class="sub">附件上传</text>
  <text x="630" y="238" text-anchor="middle" class="sub">MD5 秒传</text>
  <text x="630" y="260" text-anchor="middle" class="sub">附件下载</text>
  <text x="630" y="282" text-anchor="middle" class="sub">存储抽象层</text>

  <!-- ========== 模块 6：消息中心 ========== -->
  <line x1="770" y1="122" x2="770" y2="150" stroke="#8c9bab" stroke-width="1.8"/>
  <rect x="730" y="150" width="80" height="36" rx="6" fill="#3f7d7d"/>
  <text x="770" y="173" text-anchor="middle" class="mod">消息中心</text>
  <rect x="710" y="196" width="120" height="110" rx="6" fill="#e9f5f5" stroke="#a3cdcd"/>
  <text x="770" y="216" text-anchor="middle" class="sub">站内消息</text>
  <text x="770" y="238" text-anchor="middle" class="sub">未读提醒</text>
  <text x="770" y="260" text-anchor="middle" class="sub">WebSocket 推送</text>
  <text x="770" y="282" text-anchor="middle" class="sub">逾期预警通知</text>

  <!-- ========== 模块 7：统计报表（二级行） ========== -->
  <line x1="910" y1="122" x2="910" y2="150" stroke="#8c9bab" stroke-width="1.8"/>
  <rect x="870" y="150" width="80" height="36" rx="6" fill="#8a4a6b"/>
  <text x="910" y="173" text-anchor="middle" class="mod">统计报表</text>
  <rect x="850" y="196" width="120" height="110" rx="6" fill="#f8edf3" stroke="#d0a5bd"/>
  <text x="910" y="216" text-anchor="middle" class="sub">数据看板</text>
  <text x="910" y="238" text-anchor="middle" class="sub">项目进度统计</text>
  <text x="910" y="260" text-anchor="middle" class="sub">成员绩效</text>
  <text x="910" y="282" text-anchor="middle" class="sub">燃尽图分析</text>

  <!-- ========== 底部：公共支撑能力 ========== -->
  <line x1="490" y1="330" x2="490" y2="420" stroke="#c3d0dd" stroke-width="1.6" stroke-dasharray="5 4"/>

  <rect x="60" y="420" width="860" height="60" rx="8" fill="#f4f6f8" stroke="#c3d0dd"/>
  <text x="490" y="444" text-anchor="middle"
        style="font-family:'Microsoft YaHei',sans-serif;font-size:13px;font-weight:bold;fill:#3f5a75;">
    公共支撑能力
  </text>
  <text x="490" y="466" text-anchor="middle" class="sub">
    身份认证（JWT）· 权限控制（RBAC）· 操作日志（AOP）· 数据隔离 · 全局异常处理 · 统一响应封装 · 缓存管理 · 定时任务
  </text>

  <!-- ========== 底部：角色权限说明 ========== -->
  <rect x="60" y="500" width="860" height="150" rx="8" fill="#fbfcfd" stroke="#d6dde4"/>
  <text x="490" y="524" text-anchor="middle"
        style="font-family:'Microsoft YaHei',sans-serif;font-size:13px;font-weight:bold;fill:#3f5a75;">
    角色与功能可见范围
  </text>

  <!-- 表头 -->
  <rect x="80" y="538" width="180" height="28" rx="4" fill="#eef2f6"/>
  <text x="170" y="557" text-anchor="middle" class="sub" style="font-weight:bold;">角色</text>
  <rect x="266" y="538" width="634" height="28" rx="4" fill="#eef2f6"/>
  <text x="583" y="557" text-anchor="middle" class="sub" style="font-weight:bold;">可访问功能模块</text>

  <rect x="80" y="570" width="180" height="28" rx="4" fill="#ffffff" stroke="#e3e8ed"/>
  <text x="170" y="589" text-anchor="middle" class="sub">系统管理员</text>
  <text x="583" y="589" text-anchor="middle" class="sub">全部模块（80 个菜单权限）</text>

  <rect x="80" y="602" width="180" height="28" rx="4" fill="#ffffff" stroke="#e3e8ed"/>
  <text x="170" y="621" text-anchor="middle" class="sub">项目经理</text>
  <text x="583" y="621" text-anchor="middle" class="sub">项目管理 + 任务 + 工时审批 + 统计报表 + 消息（38 项）</text>

  <rect x="80" y="634" width="180" height="28" rx="4" fill="#ffffff" stroke="#e3e8ed"/>
  <text x="170" y="653" text-anchor="middle" class="sub">项目成员</text>
  <text x="583" y="653" text-anchor="middle" class="sub">工作台 + 项目/任务（参与的项目）+ 工时填报 + 消息（15 项）</text>
</svg>
