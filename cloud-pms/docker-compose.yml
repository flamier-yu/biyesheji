# ============================================================
# 云协同 PMS 部署编排（极简产物版）
# ============================================================
# 服务器上只需要 4 个文件，与编排文件放在同一目录：
#
#   /opt/pms/
#   ├── pms-server.jar      后端产物（本地 mvn package）
#   ├── dist/               前端产物（本地 npm run build）
#   ├── docker-compose.yml  本文件
#   └── nginx.conf          Nginx 配置
#
# 特点：
#   · 后端直接用官方 JRE 镜像挂载 jar 运行 —— 无 Dockerfile、无需 --build
#   · 数据库连接写在 ${VAR:-默认值} 中 —— .env 文件完全可选
#   · 前端 dist 是挂载的 —— 更新前端只需替换文件，无需重启任何容器
#
# 端口（宿主机侧，可在 .env 覆盖）：
#   后端  ${BACKEND_PORT:-18080}  → 容器 8080
#   前端  ${WEB_PORT:-9000}       → 容器 80
#   · 前端 nginx 走容器内网 http://backend:8080 反代后端，
#     所以后端的宿主机映射只用于本机调试，不是访问链路必需
#   · 默认值刻意避开 80 / 8080 —— 1Panel 自带的 OpenResty 通常占用这两个端口
#   · 改完端口必须 `docker compose up -d` 重建容器，`restart` 不会应用新端口
#
# 启动：docker compose up -d
# ============================================================

services:
  # ---------------- Redis（缓存/令牌） ----------------
  redis:
    image: redis:7-alpine
    container_name: pms-redis
    restart: unless-stopped
    command: redis-server --appendonly yes
    volumes:
      # 数据落在项目目录内，整个 /opt/pms 目录拷走即可完成迁移
      - ./data/redis:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 10

  # ---------------- 后端应用（官方 JRE 镜像 + 挂载 jar） ----------------
  backend:
    image: eclipse-temurin:8-jre
    container_name: pms-backend
    restart: unless-stopped
    depends_on:
      redis:
        condition: service_healthy
    # 让容器内可访问宿主机上的 MySQL（Linux 需 Docker 20.10+）
    extra_hosts:
      - "host.docker.internal:host-gateway"
    working_dir: /app
    environment:
      # 数据库连接：默认指向宿主机 MySQL，需要时建 .env 覆盖
      SPRING_DATASOURCE_URL: >-
        jdbc:mysql://${DB_HOST:-host.docker.internal}:${DB_PORT:-3306}/${DB_NAME:-biyesheji}?useUnicode=true&characterEncoding=utf8&zeroDateTimeBehavior=convertToNull&useSSL=false&serverTimezone=Asia/Shanghai&allowPublicKeyRetrieval=true&rewriteBatchedStatements=true
      SPRING_DATASOURCE_USERNAME: ${DB_USERNAME:-root}
      SPRING_DATASOURCE_PASSWORD: ${DB_PASSWORD:-root}
      SPRING_REDIS_HOST: redis
      SPRING_REDIS_PORT: 6379
      # JWT 签名密钥：生产环境务必通过 .env 设置强随机值
      PMS_JWT_SECRET: ${JWT_SECRET:-pms-yunxiao-token-secret-key-2026-please-change-in-production}
      TZ: Asia/Shanghai
    volumes:
      - ./pms-server.jar:/app/app.jar:ro
      - ./logs:/app/logs
      # 用户上传的附件落在项目目录内
      - ./data/uploads:/app/uploads
    command:
      - java
      - -Xms256m
      - -Xmx512m
      - -DLOG_HOME=/app/logs
      - -jar
      - /app/app.jar
      - --server.port=8080
    ports:
      - "${BACKEND_PORT:-18080}:8080"

  # ---------------- 前端（Nginx 托管静态资源 + 反向代理） ----------------
  frontend:
    image: nginx:1.24-alpine
    container_name: pms-frontend
    restart: unless-stopped
    depends_on:
      - backend
    volumes:
      # dist 是挂载的：更新前端时替换文件即可，无需重启本容器
      - ./dist:/usr/share/nginx/html:ro
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
    ports:
      - "${WEB_PORT:-9000}:80"

# 说明：不再使用命名卷 —— Redis 持久化与上传附件均以绑定挂载方式
# 落在项目目录（./data/），确保所有数据都在 /opt/pms 内，便于备份与迁移。
