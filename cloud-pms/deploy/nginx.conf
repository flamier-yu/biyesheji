# ============================================================
# 云协同 PMS - Nginx 配置
# 作用：托管前端静态资源 + 反向代理后端接口与 WebSocket
# 前后端同源部署，浏览器侧无需处理跨域
# ============================================================
# 【本文件在部署中的位置】
#   所属容器：frontend（nginx:1.24-alpine）
#   挂载方式：./nginx.conf → /etc/nginx/conf.d/default.conf（只读）
#   即：这份文件会「顶掉」nginx 镜像自带的默认配置。
#
# 【请求分发总览】请求抵达容器 80 端口后，按下列规则分流：
#   /dev-api/xxx        → 转发 backend:8080（业务接口，主力规则）
#   /ws/xxx             → 转发 backend:8080（WebSocket 实时推送）
#   /doc.html           → 转发 backend:8080（Knife4j 接口文档）
#   /webjars/           → 转发 backend:8080（Knife4j 静态资源）
#   /v3/api-docs        → 转发 backend:8080（OpenAPI 描述）
#   /file/download/xx   → 转发 backend:8080（附件下载，见文件中部说明）
#   /assets/*.js|css    → 读 dist 文件并缓存 30 天
#   其余任意路径         → 返回 index.html，交给前端路由（SPA 兜底）
#
# 【关于 /dev-api 这个前缀】
#   前端代码里写死了相对前缀：pms-web/src/utils/request.js 中的
#   `export const BASE_API = '/dev-api'`。
#   开发环境由 Vite 代理到 localhost:8080，生产环境由本文件代理到
#   backend:8080 —— 目标地址不同是必然的（后端位置变了），
#   但两处「剥离 /dev-api 前缀」的行为完全一致，后端收到的路径相同。
#   所以这不是配置出入，而是刻意对齐。
# ============================================================
server {
    listen       80;                  # 容器内监听 80；宿主机侧由 compose 映射为 9000
    server_name  localhost;           # 全文件只有一个 server 块，它会自动成为默认
                                      # server，因此用 IP 访问也能命中（换域名时再改）

    charset utf-8;                    # 响应头声明 UTF-8，防中文乱码
    client_max_body_size 100m;        # ⚠️ 必须 ≥ 后端 spring.servlet.multipart 的
                                      # max-request-size（同为 100MB）。写小了上传大
                                      # 附件会在 nginx 层被拦（413），根本到不了后端

    access_log  /var/log/nginx/pms.access.log;
    error_log   /var/log/nginx/pms.error.log;

    # ---------- 前端静态资源 ----------
    location / {
        root      /usr/share/nginx/html;   # 对应 compose 挂载进来的 dist 目录
        index     index.html;
        try_files $uri $uri/ /index.html;  # ★ 单页应用的命脉：依次尝试
                                           #   「文件 → 目录 → index.html」。
                                           #   保证直接输入 /project/list 或刷新
                                           #   页面时不 404，交给前端路由处理
    }

    # 静态资源缓存
    # ~* = 不区分大小写的正则匹配。Vite 产物带内容哈希（如 index-B-cHyDFN.css），
    # 内容一变文件名就变，因此可以放心长缓存
    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff2?|ttf|eot)$ {
        root      /usr/share/nginx/html;
        expires   30d;
        add_header Cache-Control "public, immutable";
        # ⚠️ nginx 的 add_header 继承规则：子块只要定义了任意一个 add_header，
        #    父块（server 级）的所有 add_header 就全部失效 —— 是覆盖，不是叠加。
        #    因此本块内的响应拿不到文件末尾那三个安全头。
        #    若要补齐，把末尾三条安全头在本块内重复写一遍即可。
    }

    # ---------- 后端接口（主力规则） ----------
    location /dev-api/ {
        # ★ proxy_pass 末尾那个 "/" 不能删 —— 它决定前缀剥离：
        #     /dev-api/system/user  →  http://backend:8080/system/user
        #   作用与 vite.config.js 里的 rewrite 完全相同。
        #   另：backend 是 Docker 内置 DNS 解析的服务名，不是真实域名
        proxy_pass         http://backend:8080/;

        # 以下四行把「真实来源信息」透传给后端。请求经 nginx 转发后，后端看到的
        # 来源 IP 会变成 nginx 容器的内网 IP，必须靠这些头还原 ——
        # 否则操作日志、登录日志里记录的 IP 全都是容器地址
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;

        proxy_connect_timeout 30s;    # 与后端建立连接的超时
        proxy_read_timeout    120s;   # 等待后端响应的超时（导出报表等慢接口靠它）
        proxy_send_timeout    120s;
    }

    # ---------- 接口文档（可选开放，生产环境建议关闭） ----------
    # 以下三条是 Knife4j 需要的：主页面 + 前端静态资源 + OpenAPI 描述文件
    location /doc.html {
        proxy_pass http://backend:8080/doc.html;
        proxy_set_header Host $host;
    }

    location /webjars/ {
        proxy_pass http://backend:8080/webjars/;
        proxy_set_header Host $host;
    }

    location /v3/api-docs {
        proxy_pass http://backend:8080/v3/api-docs;
        proxy_set_header Host $host;
    }

    # ---------- WebSocket 消息推送 ----------
    # 后端端点实际是 @ServerEndpoint("/ws/message/{userId}")，即 /ws/message/12。
    # 注意：WebSocket 路径不带 /dev-api 前缀（vite.config.js 也单独给 /ws 配了代理）
    location /ws/ {
        proxy_pass          http://backend:8080/ws/;
        proxy_http_version  1.1;                      # ★ WebSocket 必须用 HTTP/1.1
        proxy_set_header    Upgrade    $http_upgrade; # ★ 传递协议升级意图
        proxy_set_header    Connection "upgrade";     # ★ 声明升级为 WebSocket
        proxy_set_header    Host       $host;
        # ★ 长连接：默认 60s 就会被掐断，这里放宽到 1 小时
        proxy_read_timeout  3600s;
        proxy_send_timeout  3600s;
    }

    # ---------- 附件下载 ----------
    # ⚠️ 已知「永不命中」的配置，保留作防御：
    #   前端实际请求的是 ${BASE_API}/file/download/{id}
    #     → /dev-api/file/download/123
    #   它以 /dev-api 开头，会先被上面的 location /dev-api/ 捕获，
    #   永远走不到本块。仅当有人直接访问 /file/download/xxx（不带前缀）时才生效。
    #   后端对应接口：@GetMapping("/download/{attachId}")
    location /file/download/ {
        proxy_pass       http://backend:8080/file/download/;
        proxy_set_header Host $host;
    }

    # ---------- 安全响应头 ----------
    # ⚠️ 受 add_header 继承规则限制（详见上方静态资源 location 的说明）：
    #    这三条只对「自身没有 add_header 的 location」生效，
    #    对 js/css/图片 那类正则 location 不生效。
    add_header X-Frame-Options        SAMEORIGIN;      # 防点击劫持（禁止被 iframe 嵌套）
    add_header X-Content-Type-Options nosniff;         # 防 MIME 类型嗅探
    add_header X-XSS-Protection       "1; mode=block"; # 老式 XSS 过滤器（新版浏览器已弃用，无害）
}
