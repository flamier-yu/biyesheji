# ============================================================
# 云协同 PMS - Nginx 配置
# 作用：托管前端静态资源 + 反向代理后端接口与 WebSocket
# 前后端同源部署，浏览器侧无需处理跨域
# ============================================================
server {
    listen       80;
    server_name  localhost;

    charset utf-8;
    client_max_body_size 100m;

    access_log  /var/log/nginx/pms.access.log;
    error_log   /var/log/nginx/pms.error.log;

    # ---------- 前端静态资源 ----------
    location / {
        root      /usr/share/nginx/html;
        index     index.html;
        try_files $uri $uri/ /index.html;
    }

    # 静态资源缓存
    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff2?|ttf|eot)$ {
        root      /usr/share/nginx/html;
        expires   30d;
        add_header Cache-Control "public, immutable";
    }

    # ---------- 后端接口 ----------
    location /dev-api/ {
        proxy_pass         http://backend:8080/;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;

        proxy_connect_timeout 30s;
        proxy_read_timeout    120s;
        proxy_send_timeout    120s;
    }

    # ---------- 接口文档（可选开放） ----------
    location /doc.html {
        proxy_pass http://backend:8080/doc.html;
        proxy_set_header Host $host;
    }

    location /webjars/ {
        proxy_pass http://backend:8080/webjars/;
        proxy_set_header Host $host;
    }

    location /v3/api-docs {
        proxy_pass http://backend:8080/v3/api-docs;
        proxy_set_header Host $host;
    }

    # ---------- WebSocket 消息推送 ----------
    location /ws/ {
        proxy_pass          http://backend:8080/ws/;
        proxy_http_version  1.1;
        proxy_set_header    Upgrade    $http_upgrade;
        proxy_set_header    Connection "upgrade";
        proxy_set_header    Host       $host;
        proxy_read_timeout  3600s;
        proxy_send_timeout  3600s;
    }

    # ---------- 附件下载 ----------
    location /file/download/ {
        proxy_pass       http://backend:8080/file/download/;
        proxy_set_header Host $host;
    }

    # ---------- 安全响应头 ----------
    add_header X-Frame-Options        SAMEORIGIN;
    add_header X-Content-Type-Options nosniff;
    add_header X-XSS-Protection       "1; mode=block";
}
