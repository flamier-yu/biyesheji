version: "3.8"

# ============================================================
# 云协同 PMS 部署编排（混合模式）
# ============================================================
# 部署拓扑：
#   MySQL     → 宿主机 / 外部数据库（本编排不创建，需你自行部署）
#   Redis     → 容器（缓存类，容器化无数据风险）
#   Backend   → 容器（Spring Boot）
#   Frontend  → 容器（Nginx 托管静态资源 + 反向代理）
#
# 使用步骤：
#   1) 宿主机准备好 MySQL，执行 sql/ 下三个脚本建库
#   2) 执行 deploy/init-external-db.sql 给应用账号授权远程访问
#   3) 复制 .env.example 为 .env，填入数据库地址与账号密码
#   4) 构建产物：
#        cd pms-server && mvn clean package -DskipTests && cd ..
#        cd pms-web   && npm install && npm run build     && cd ..
#   5) 启动：docker compose up -d
#   6) 访问：http://localhost
# ============================================================

services:
  # ---------------- Redis（容器化） ----------------
  redis:
    image: redis:7-alpine
    container_name: pms-redis
    restart: unless-stopped
    command: redis-server --appendonly yes --requirepass ${REDIS_PASSWORD:-}
    ports:
      # 仅监听本机，不对外暴露；如无需宿主机调试可直接删掉这段
      - "127.0.0.1:${REDIS_PORT:-6379}:6379"
    volumes:
      - redis-data:/data
    healthcheck:
      # 注意：若在 .env 中给 Redis 设置了密码，这里需改为
      #   test: ["CMD", "redis-cli", "-a", "yourpassword", "ping"]
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 10

  # ---------------- 后端应用（容器化） ----------------
  backend:
    build:
      context: ./pms-server
      dockerfile: Dockerfile
    container_name: pms-backend
    restart: unless-stopped
    depends_on:
      redis:
        condition: service_healthy
    # 关键配置：让容器内可以用 host.docker.internal 访问宿主机上的 MySQL
    # Docker Desktop(Windows/Mac) 原生支持；Linux 需 20.10+ 并显式声明 host-gateway
    extra_hosts:
      - "host.docker.internal:host-gateway"
    environment:
      # ---- 外部 MySQL（值来自 .env） ----
      SPRING_DATASOURCE_URL: >-
        jdbc:mysql://${DB_HOST}:${DB_PORT}/${DB_NAME}?useUnicode=true&characterEncoding=utf8&zeroDateTimeBehavior=convertToNull&useSSL=false&serverTimezone=Asia/Shanghai&allowPublicKeyRetrieval=true&rewriteBatchedStatements=true
      SPRING_DATASOURCE_USERNAME: ${DB_USER}
      SPRING_DATASOURCE_PASSWORD: ${DB_PASSWORD}
      # ---- 容器内 Redis ----
      SPRING_REDIS_HOST: redis
      SPRING_REDIS_PORT: 6379
      SPRING_REDIS_PASSWORD: ${REDIS_PASSWORD:-}
      # ---- 应用配置 ----
      PMS_JWT_SECRET: ${JWT_SECRET:-pms-yunxiao-token-secret-key-2026-please-change-in-production}
      TZ: Asia/Shanghai
    volumes:
      - upload-data:/app/uploads
      - ./logs:/app/logs
    ports:
      - "${BACKEND_PORT:-8080}:8080"

  # ---------------- 前端 Nginx（容器化） ----------------
  frontend:
    image: nginx:1.24-alpine
    container_name: pms-frontend
    restart: unless-stopped
    depends_on:
      - backend
    volumes:
      - ./pms-web/dist:/usr/share/nginx/html:ro
      - ./deploy/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    ports:
      - "${WEB_PORT:-80}:80"

volumes:
  # 注意：MySQL 数据不再由本编排管理，故无 mysql-data 卷
  redis-data:
  upload-data:
