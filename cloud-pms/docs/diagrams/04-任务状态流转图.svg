<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 720" width="960" height="720">
  <title>任务状态流转图</title>
  <desc>描述任务在待开始、进行中、已完成、已挂起四个状态之间的流转规则，以及每次流转对项目进度的影响。</desc>

  <defs>
    <style>
      .st      { font-family:"Microsoft YaHei",sans-serif; font-size:14px; font-weight:bold; fill:#ffffff; }
      .st-sub  { font-family:"Microsoft YaHei",sans-serif; font-size:10px; fill:#e3ecf4; }
      .tr      { font-family:"Microsoft YaHei",sans-serif; font-size:11px; fill:#33475b; }
      .title   { font-family:"Microsoft YaHei",sans-serif; font-size:18px; font-weight:bold; fill:#1f2d3d; }
      .sec     { font-family:"Microsoft YaHei",sans-serif; font-size:13px; font-weight:bold; fill:#3f5a75; }
    </style>
    <marker id="fwd" viewBox="0 0 10 10" refX="9" refY="5"
            markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M1 1 L9 5 L1 9" fill="none" stroke="#2f7d5b" stroke-width="1.7"
            stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
    <marker id="back" viewBox="0 0 10 10" refX="9" refY="5"
            markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M1 1 L9 5 L1 9" fill="none" stroke="#a8763f" stroke-width="1.7"
            stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
    <marker id="gray" viewBox="0 0 10 10" refX="9" refY="5"
            markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M1 1 L9 5 L1 9" fill="none" stroke="#8c9bab" stroke-width="1.7"
            stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
  </defs>

  <rect x="0" y="0" width="960" height="720" fill="#ffffff"/>

  <text x="480" y="34" text-anchor="middle" class="title">任务状态流转图</text>

  <!-- ========== 状态节点 ========== -->
  <!-- 待开始 -->
  <rect x="90" y="90" width="150" height="66" rx="10" fill="#7a8fa6"/>
  <text x="165" y="120" text-anchor="middle" class="st">待开始</text>
  <text x="165" y="140" text-anchor="middle" class="st-sub">status = 0</text>

  <!-- 进行中 -->
  <rect x="405" y="90" width="150" height="66" rx="10" fill="#3f6ea8"/>
  <text x="480" y="120" text-anchor="middle" class="st">进行中</text>
  <text x="480" y="140" text-anchor="middle" class="st-sub">status = 1</text>

  <!-- 已完成 -->
  <rect x="720" y="90" width="150" height="66" rx="10" fill="#2f7d5b"/>
  <text x="795" y="120" text-anchor="middle" class="st">已完成</text>
  <text x="795" y="140" text-anchor="middle" class="st-sub">status = 2</text>

  <!-- 已挂起 -->
  <rect x="405" y="270" width="150" height="66" rx="10" fill="#8a6d3b"/>
  <text x="480" y="300" text-anchor="middle" class="st">已挂起</text>
  <text x="480" y="320" text-anchor="middle" class="st-sub">status = 3</text>

  <!-- ========== 正向流转 ========== -->
  <!-- 待开始 -> 进行中 -->
  <line x1="240" y1="123" x2="400" y2="123" stroke="#2f7d5b" stroke-width="1.7" marker-end="url(#fwd)"/>
  <rect x="252" y="98" width="136" height="20" rx="4" fill="#eef8f3"/>
  <text x="320" y="112" text-anchor="middle" class="tr">开始执行</text>

  <!-- 进行中 -> 已完成 -->
  <line x1="555" y1="123" x2="715" y2="123" stroke="#2f7d5b" stroke-width="1.7" marker-end="url(#fwd)"/>
  <rect x="567" y="98" width="136" height="20" rx="4" fill="#eef8f3"/>
  <text x="635" y="112" text-anchor="middle" class="tr">提交完成（进度 100%）</text>

  <!-- 待开始 -> 已完成（直接完成） -->
  <path d="M165 156 L165 210 L795 210 L795 160" fill="none" stroke="#2f7d5b"
        stroke-width="1.7" stroke-dasharray="7 5" marker-end="url(#fwd)"/>
  <rect x="400" y="196" width="150" height="20" rx="4" fill="#eef8f3"/>
  <text x="475" y="210" text-anchor="middle" class="tr">管理员直接标记完成</text>

  <!-- 进行中 -> 已挂起 -->
  <line x1="480" y1="156" x2="480" y2="265" stroke="#a8763f" stroke-width="1.7" marker-end="url(#back)"/>
  <rect x="492" y="200" width="112" height="20" rx="4" fill="#faf5e9"/>
  <text x="548" y="214" text-anchor="middle" class="tr">挂起（阻塞）</text>

  <!-- 已挂起 -> 进行中 -->
  <path d="M418 303 L370 303 L370 123 L400 123" fill="none" stroke="#2f7d5b"
        stroke-width="1.7" marker-end="url(#fwd)"/>
  <rect x="300" y="278" width="96" height="20" rx="4" fill="#eef8f3"/>
  <text x="348" y="292" text-anchor="middle" class="tr">恢复执行</text>

  <!-- 已完成 -> 进行中（回退） -->
  <path d="M795 160 L795 230 L556 230 L556 156" fill="none" stroke="#a8763f"
        stroke-width="1.7" stroke-dasharray="7 5" marker-end="url(#back)"/>
  <rect x="600" y="216" width="128" height="20" rx="4" fill="#faf5e9"/>
  <text x="664" y="230" text-anchor="middle" class="tr">验收不通过，回退</text>

  <!-- ========== 状态说明表 ========== -->
  <rect x="60" y="376" width="840" height="150" rx="8" fill="#fbfcfd" stroke="#d6dde4"/>
  <text x="480" y="400" text-anchor="middle" class="sec">状态与进度对应关系</text>

  <rect x="80" y="414" width="150" height="28" rx="4" fill="#eef2f6"/>
  <text x="155" y="433" text-anchor="middle" class="tr" style="font-weight:bold;">状态</text>
  <rect x="236" y="414" width="120" height="28" rx="4" fill="#eef2f6"/>
  <text x="296" y="433" text-anchor="middle" class="tr" style="font-weight:bold;">进度值</text>
  <rect x="362" y="414" width="518" height="28" rx="4" fill="#eef2f6"/>
  <text x="621" y="433" text-anchor="middle" class="tr" style="font-weight:bold;">说明</text>

  <rect x="80" y="446" width="150" height="26" rx="4" fill="#ffffff" stroke="#e3e8ed"/>
  <text x="155" y="464" text-anchor="middle" class="tr">待开始</text>
  <rect x="236" y="446" width="120" height="26" rx="4" fill="#ffffff" stroke="#e3e8ed"/>
  <text x="296" y="464" text-anchor="middle" class="tr">0</text>
  <text x="370" y="464" class="tr">任务已创建但尚未分配或未启动</text>

  <rect x="80" y="476" width="150" height="26" rx="4" fill="#ffffff" stroke="#e3e8ed"/>
  <text x="155" y="494" text-anchor="middle" class="tr">进行中</text>
  <rect x="236" y="476" width="120" height="26" rx="4" fill="#ffffff" stroke="#e3e8ed"/>
  <text x="296" y="494" text-anchor="middle" class="tr">0 ~ 99</text>
  <text x="370" y="494" class="tr">负责人正在执行，可手动调整进度</text>

  <rect x="80" y="506" width="150" height="26" rx="4" fill="#ffffff" stroke="#e3e8ed"/>
  <text x="155" y="524" text-anchor="middle" class="tr">已完成</text>
  <rect x="236" y="506" width="120" height="26" rx="4" fill="#ffffff" stroke="#e3e8ed"/>
  <text x="296" y="524" text-anchor="middle" class="tr">100（强制）</text>
  <text x="370" y="524" class="tr">自动写入实际完成日期，并触发项目进度重算</text>

  <!-- ========== 联动说明 ========== -->
  <rect x="60" y="546" width="840" height="150" rx="8" fill="#f0f8f4" stroke="#b5ddd0"/>
  <text x="480" y="572" text-anchor="middle" class="sec" fill="#2f7d5b">状态变更引发的业务联动</text>

  <text x="86" y="600" class="tr" style="font-weight:bold;">① 项目进度自动重算</text>
  <text x="106" y="620" class="tr">项目进度 = 已完成任务数 ÷ 任务总数 × 100%，由任务增删改触发，不需要人工维护。</text>

  <text x="86" y="644" class="tr" style="font-weight:bold;">② 项目状态自动流转</text>
  <text x="106" y="664" class="tr">当项目进度达到 100%（任务全部完成）时，项目状态自动置为「已完成」并记录实际结束日期。</text>

  <text x="86" y="688" class="tr" style="font-weight:bold;">③ 逾期预警</text>
  <text x="540" y="688" class="tr">每日 09:00 定时扫描：计划结束日期早于当天且未完成的任务，向负责人与项目经理推送预警。</text>
</svg>
