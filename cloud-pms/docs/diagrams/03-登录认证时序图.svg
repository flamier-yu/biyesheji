<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 700" width="960" height="700">
  <title>用户登录认证时序图</title>
  <desc>描述用户从获取验证码、提交登录、密码校验、令牌签发到携带令牌访问受保护接口的完整时序。</desc>

  <defs>
    <style>
      .actor   { font-family:"Microsoft YaHei",sans-serif; font-size:12px; font-weight:bold; fill:#1f2d3d; }
      .actor-s { font-family:"Microsoft YaHei",sans-serif; font-size:10px; fill:#7a8a99; }
      .msg     { font-family:"Microsoft YaHei",sans-serif; font-size:11px; fill:#33475b; }
      .num     { font-family:"Microsoft YaHei",sans-serif; font-size:10px; fill:#95a5b5; }
      .note    { font-family:"Microsoft YaHei",sans-serif; font-size:10px; fill:#8a6d3b; }
    </style>
    <marker id="seqArrow" viewBox="0 0 10 10" refX="9" refY="5"
            markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M1 1 L9 5 L1 9" fill="none" stroke="#4a6b8a" stroke-width="1.5"
            stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
    <marker id="seqArrowGray" viewBox="0 0 10 10" refX="9" refY="5"
            markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M1 1 L9 5 L1 9" fill="none" stroke="#9aa8b5" stroke-width="1.5"
            stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
  </defs>

  <rect x="0" y="0" width="960" height="700" fill="#ffffff"/>

  <text x="480" y="30" text-anchor="middle"
        style="font-family:'Microsoft YaHei',sans-serif;font-size:18px;font-weight:bold;fill:#1f2d3d;">
    用户登录认证时序图
  </text>

  <!-- ========== 参与者 ========== -->
  <!-- 1 用户 -->
  <rect x="30" y="56" width="96" height="40" rx="6" fill="#3f6ea8"/>
  <text x="78" y="74" text-anchor="middle" class="actor" fill="#ffffff">用户</text>
  <text x="78" y="88" text-anchor="middle" class="actor-s" fill="#d6e4f2">User</text>
  <line x1="78" y1="96" x2="78" y2="660" stroke="#c3d0dd" stroke-width="1.4" stroke-dasharray="6 5"/>

  <!-- 2 前端 -->
  <rect x="160" y="56" width="110" height="40" rx="6" fill="#2f7d5b"/>
  <text x="215" y="74" text-anchor="middle" class="actor" fill="#ffffff">前端应用</text>
  <text x="215" y="88" text-anchor="middle" class="actor-s" fill="#d6f0e4">Vue 3</text>
  <line x1="215" y1="96" x2="215" y2="660" stroke="#c3d0dd" stroke-width="1.4" stroke-dasharray="6 5"/>

  <!-- 3 控制器 -->
  <rect x="310" y="56" width="120" height="40" rx="6" fill="#7b5e9c"/>
  <text x="370" y="74" text-anchor="middle" class="actor" fill="#ffffff">登录控制器</text>
  <text x="370" y="88" text-anchor="middle" class="actor-s" fill="#e8dcf2">SysLoginController</text>
  <line x1="370" y1="96" x2="370" y2="660" stroke="#c3d0dd" stroke-width="1.4" stroke-dasharray="6 5"/>

  <!-- 4 安全框架 -->
  <rect x="470" y="56" width="130" height="40" rx="6" fill="#8a6d3b"/>
  <text x="535" y="74" text-anchor="middle" class="actor" fill="#ffffff">认证管理器</text>
  <text x="535" y="88" text-anchor="middle" class="actor-s" fill="#f2e8d6">AuthenticationManager</text>
  <line x1="535" y1="96" x2="535" y2="660" stroke="#c3d0dd" stroke-width="1.4" stroke-dasharray="6 5"/>

  <!-- 5 数据库 -->
  <rect x="640" y="56" width="110" height="40" rx="6" fill="#a8763f"/>
  <text x="695" y="74" text-anchor="middle" class="actor" fill="#ffffff">用户数据源</text>
  <text x="695" y="88" text-anchor="middle" class="actor-s" fill="#f2e4d6">MySQL</text>
  <line x1="695" y1="96" x2="695" y2="660" stroke="#c3d0dd" stroke-width="1.4" stroke-dasharray="6 5"/>

  <!-- 6 Redis -->
  <rect x="800" y="56" width="130" height="40" rx="6" fill="#a05a3f"/>
  <text x="865" y="74" text-anchor="middle" class="actor" fill="#ffffff">令牌与验证码</text>
  <text x="865" y="88" text-anchor="middle" class="actor-s" fill="#f2dcd6">Redis</text>
  <line x1="865" y1="96" x2="865" y2="660" stroke="#c3d0dd" stroke-width="1.4" stroke-dasharray="6 5"/>

  <!-- ========== 阶段一：获取验证码 ========== -->
  <rect x="20" y="112" width="920" height="86" rx="6" fill="#f7f9fb" stroke="#dde4ea"/>
  <text x="34" y="130" class="note" style="font-weight:bold;">阶段一：获取图形验证码</text>

  <line x1="78" y1="146" x2="215" y2="146" stroke="#4a6b8a" stroke-width="1.5" marker-end="url(#seqArrow)"/>
  <text x="146" y="141" text-anchor="middle" class="msg">① 打开登录页</text>

  <line x1="215" y1="168" x2="865" y2="168" stroke="#4a6b8a" stroke-width="1.5" marker-end="url(#seqArrow)"/>
  <text x="540" y="163" text-anchor="middle" class="msg">② GET /captcha　生成验证码并缓存（有效期 2 分钟）</text>

  <line x1="865" y1="188" x2="215" y2="188" stroke="#9aa8b5" stroke-width="1.5" stroke-dasharray="5 4" marker-end="url(#seqArrowGray)"/>
  <text x="540" y="183" text-anchor="middle" class="msg">③ 返回 uuid + Base64 图片</text>

  <!-- ========== 阶段二：提交登录 ========== -->
  <rect x="20" y="208" width="920" height="210" rx="6" fill="#f7f9fb" stroke="#dde4ea"/>
  <text x="34" y="226" class="note" style="font-weight:bold;">阶段二：提交登录并校验身份</text>

  <line x1="78" y1="244" x2="215" y2="244" stroke="#4a6b8a" stroke-width="1.5" marker-end="url(#seqArrow)"/>
  <text x="146" y="239" text-anchor="middle" class="msg">④ 输入账号密码验证码</text>

  <line x1="215" y1="266" x2="370" y2="266" stroke="#4a6b8a" stroke-width="1.5" marker-end="url(#seqArrow)"/>
  <text x="292" y="261" text-anchor="middle" class="msg">⑤ POST /login</text>

  <line x1="370" y1="288" x2="865" y2="288" stroke="#4a6b8a" stroke-width="1.5" marker-end="url(#seqArrow)"/>
  <text x="617" y="283" text-anchor="middle" class="msg">⑥ 校验验证码（比对后立即删除，防重复使用）</text>

  <line x1="370" y1="310" x2="535" y2="310" stroke="#4a6b8a" stroke-width="1.5" marker-end="url(#seqArrow)"/>
  <text x="452" y="305" text-anchor="middle" class="msg">⑦ authenticate()</text>

  <line x1="535" y1="332" x2="695" y2="332" stroke="#4a6b8a" stroke-width="1.5" marker-end="url(#seqArrow)"/>
  <text x="615" y="327" text-anchor="middle" class="msg">⑧ 按账号查询用户</text>

  <line x1="695" y1="354" x2="535" y2="354" stroke="#9aa8b5" stroke-width="1.5" stroke-dasharray="5 4" marker-end="url(#seqArrowGray)"/>
  <text x="615" y="349" text-anchor="middle" class="msg">⑨ 返回用户信息（含 BCrypt 密文）</text>

  <rect x="546" y="362" width="230" height="30" rx="4" fill="#fff8e6" stroke="#e6cfa8"/>
  <text x="661" y="381" text-anchor="middle" class="note">⑩ BCrypt 比对密码（自带随机盐）</text>

  <!-- ========== 阶段三：签发令牌 ========== -->
  <rect x="20" y="428" width="920" height="122" rx="6" fill="#f7f9fb" stroke="#dde4ea"/>
  <text x="34" y="446" class="note" style="font-weight:bold;">阶段三：签发令牌并记录日志</text>

  <line x1="535" y1="462" x2="370" y2="462" stroke="#9aa8b5" stroke-width="1.5" stroke-dasharray="5 4" marker-end="url(#seqArrowGray)"/>
  <text x="452" y="457" text-anchor="middle" class="msg">⑪ 返回认证成功</text>

  <line x1="370" y1="484" x2="865" y2="484" stroke="#4a6b8a" stroke-width="1.5" marker-end="url(#seqArrow)"/>
  <text x="617" y="479" text-anchor="middle" class="msg">⑫ 生成随机令牌标识，写入 LoginUser（有效期 120 分钟）</text>

  <line x1="370" y1="506" x2="370" y2="506" stroke="#4a6b8a" stroke-width="1.5"/>
  <text x="370" y="524" text-anchor="middle" class="msg">⑬ 记录登录日志（成功/失败均记录，含 IP 与浏览器）</text>

  <line x1="370" y1="540" x2="215" y2="540" stroke="#9aa8b5" stroke-width="1.5" stroke-dasharray="5 4" marker-end="url(#seqArrowGray)"/>
  <text x="292" y="535" text-anchor="middle" class="msg">⑭ 返回 JWT token</text>

  <!-- ========== 阶段四：携带令牌访问 ========== -->
  <rect x="20" y="558" width="920" height="102" rx="6" fill="#f0f8f4" stroke="#b5ddd0"/>
  <text x="34" y="576" class="note" style="font-weight:bold;fill:#2f7d5b;">阶段四：携带令牌访问受保护接口</text>

  <line x1="215" y1="594" x2="215" y2="594" stroke="#4a6b8a" stroke-width="1.5"/>
  <text x="215" y="612" text-anchor="middle" class="msg">⑮ 前端将 token 存入 localStorage，请求头自动携带 Authorization: Bearer &lt;token&gt;</text>

  <line x1="695" y1="630" x2="865" y2="630" stroke="#4a6b8a" stroke-width="1.5" marker-end="url(#seqArrow)"/>
  <text x="780" y="625" text-anchor="middle" class="msg">⑯ 按令牌标识取出登录用户</text>

  <line x1="215" y1="650" x2="370" y2="650" stroke="#4a6b8a" stroke-width="1.5" marker-end="url(#seqArrow)"/>
  <text x="292" y="645" text-anchor="middle" class="msg">⑰ 校验权限并执行业务，返回数据</text>

  <text x="480" y="684" text-anchor="middle" class="num">
    说明：令牌临近过期（剩余不足 30 分钟）时，过滤器会自动续期，避免用户操作中途被强制登出。
  </text>
</svg>
